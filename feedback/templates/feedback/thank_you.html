<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Thank You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #4338ca);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .thank-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 24px;
            padding: 42px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.22);
        }

        .thank-icon {
            width: 72px;
            height: 72px;
            background: #dcfce7;
            color: #166534;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 22px;
            font-weight: 900;
        }

        h1 {
            font-weight: 900;
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            font-weight: 600;
        }

        .btn-home {
            background: #4338ca;
            color: white;
            border-radius: 12px;
            padding: 11px 20px;
            font-weight: 900;
            text-decoration: none;
            display: inline-block;
            margin-top: 18px;
        }

        .btn-home:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="thank-card">
    <div class="thank-icon">✓</div>
    <h1>Thank You</h1>
    <p>Your feedback has been submitted successfully.</p>

    <a href="{% url 'home' %}" class="btn-home">Submit Another Feedback</a>
</div>

</body>
</html>
