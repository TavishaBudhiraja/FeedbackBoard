<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Feedback Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #e0f2fe 0, transparent 30%),
                radial-gradient(circle at bottom right, #fce7f3 0, transparent 30%),
                #f8fafc;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px;
        }

        .feedback-card {
            width: 100%;
            max-width: 1050px;
            background: white;
            border-radius: 26px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            overflow: hidden;
            display: grid;
            grid-template-columns: 38% 62%;
        }

        .left-panel {
            background: linear-gradient(135deg, #0f172a, #4338ca);
            color: white;
            padding: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .left-panel p {
            font-size: 16px;
            line-height: 1.7;
            color: #dbeafe;
        }

        .badge-soft {
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.22);
            color: white;
            padding: 9px 13px;
            border-radius: 999px;
            font-weight: 700;
            width: fit-content;
            margin-bottom: 22px;
        }

        .form-panel {
            padding: 42px;
        }

        .form-title {
            font-size: 28px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 6px;
        }

        .form-subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        label {
            font-weight: 800;
            color: #111827;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 13px;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #4338ca;
            box-shadow: 0 0 0 0.18rem rgba(67, 56, 202, 0.15);
        }

        .question-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .optional-text {
            font-size: 12px;
            color: #6b7280;
            font-weight: 700;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4338ca, #0f172a);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 13px 22px;
            font-weight: 900;
            width: 100%;
            box-shadow: 0 14px 28px rgba(67, 56, 202, 0.25);
        }

        .btn-submit:hover {
            color: white;
            transform: translateY(-1px);
        }

        .dashboard-link {
            text-align: center;
            margin-top: 18px;
            font-weight: 700;
        }

        .dashboard-link a {
            color: #4338ca;
            text-decoration: none;
            font-weight: 900;
        }
    </style>
</head>

<body>

<div class="page-wrapper">
    <div class="feedback-card">

        <div class="left-panel">
            <div class="badge-soft">Customer Feedback</div>
            <h1>Your opinion helps us improve.</h1>
            <p>
                Please share your experience by answering four simple questions.
                Your name and email are optional, so you may submit feedback anonymously.
            </p>
        </div>

        <div class="form-panel">
            <h2 class="form-title">Feedback Form</h2>
            <p class="form-subtitle">Rate each question from 1 to 5.</p>

            <form method="POST">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Name <span class="optional-text">(optional)</span></label>
                        <input type="text" name="name" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email <span class="optional-text">(optional)</span></label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email">
                    </div>
                </div>

                <div class="question-box">
                    <label>1. How satisfied are you with the quality of service?</label>
                    <select name="service_quality" class="form-select" required>
                        <option value="">Select rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Very Poor</option>
                    </select>
                </div>

                <div class="question-box">
                    <label>2. How would you rate the response time?</label>
                    <select name="response_time" class="form-select" required>
                        <option value="">Select rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Very Poor</option>
                    </select>
                </div>

                <div class="question-box">
                    <label>3. How professional and helpful was the staff?</label>
                    <select name="staff_behavior" class="form-select" required>
                        <option value="">Select rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Very Poor</option>
                    </select>
                </div>

                <div class="question-box">
                    <label>4. How would you rate your overall experience?</label>
                    <select name="overall_experience" class="form-select" required>
                        <option value="">Select rating</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Very Poor</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label>Additional Comments <span class="optional-text">(optional)</span></label>
                    <textarea name="comments" class="form-control" rows="3" placeholder="Write your feedback here"></textarea>
                </div>

                <button type="submit" class="btn btn-submit">
                    Submit Feedback
                </button>
            </form>

                    </div>

    </div>
</div>

</body>
</html>
